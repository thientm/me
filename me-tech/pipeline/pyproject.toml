[project]
name = "me-tech-pipeline"
version = "1.0.0"
description = "Dựng video tin AI tiếng Việt cho kênh Mê Tech — giọng đọc local, timeline suy ra từ giọng"
requires-python = ">=3.10"
dependencies = [
    "vieneu>=3.8.0",        # TTS tiếng Việt, chạy CPU/ONNX, Apache 2.0
    "faster-whisper>=1.2",  # cổng kiểm chứng giọng đọc
    "playwright>=1.50",     # chụp frame từ HTML
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.uv]
package = false
